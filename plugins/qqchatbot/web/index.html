<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 机器人</title>
<link rel="stylesheet" href="/plugins/_sdk/bridge-plugin.css">
<style>
  html, body { height: 100%; }
  .wrap { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  .side { border-right: .5px solid var(--bp-line); overflow-y: auto; display: flex; flex-direction: column; }
  .side-h { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .grow { flex: 1; min-width: 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts .bp-btn { font-size: 12.5px; padding: 5px 10px; }
  .hint { font-size: 12px; color: var(--bp-muted); line-height: 1.5; overflow-wrap: anywhere; }
  .hint code { user-select: all; }
  .qr { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border-radius: var(--bp-radius); background: var(--bp-card); box-shadow: 0 0 0 .5px var(--bp-line); }
  .qr img { width: 200px; height: 200px; border-radius: 8px; background: #fff; image-rendering: pixelated; }
  .qr b { font-size: 14px; }
  .tabs { margin: 0 10px 8px; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .main-h { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: .5px solid var(--bp-line); flex-wrap: wrap; }
  .main-h b { flex: 1; min-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msgs { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { max-width: 82%; }
  .m .who { font-size: 12px; color: var(--bp-muted); margin-bottom: 3px; }
  .m .tx { background: var(--bp-card); box-shadow: 0 0 0 .5px var(--bp-line); border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .m .tools { font-size: 12px; color: var(--bp-muted); margin-top: 4px; }
  .m.bot { align-self: flex-end; }
  .m.bot .who { text-align: right; }
  .m.bot .tx { background: color-mix(in srgb, var(--bp-accent) 18%, var(--bp-card)); }
  .send { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: .5px solid var(--bp-line); }
  .send .bp-textarea { min-height: 40px; height: 40px; }
  .gset { padding: 12px 16px 4px; border-bottom: .5px solid var(--bp-line); }
  .gset .bp-section { margin: 0 0 10px; }
  .settings { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .settings .bp-section { margin-bottom: 18px; }
  .off { opacity: .55; }
  .back { display: none; }
  .usage { font-size: 12px; color: var(--bp-muted); }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--bp-muted); }
  .dot.on { background: var(--bp-ok); }
  @media (max-width: 680px) {
    .wrap { grid-template-columns: 1fr; }
    .wrap.open .side { display: none; }
    .wrap:not(.open) .main { display: none; }
    .back { display: inline-block; }
    .m { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <aside class="side">
    <div class="side-h">
      <span class="bp-badge" id="state">连接中…</span>
      <div id="qrBox"></div>
      <div class="acts" id="acts"></div>
      <div class="row">
        <span class="grow">暂停回答（所有群）</span>
        <label class="bp-switch"><input type="checkbox" id="pause" aria-label="暂停回答"><span></span></label>
      </div>
      <div class="usage" id="usage"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="bp-seg tabs" id="sideTabs" role="tablist">
      <button data-v="chats" class="on">群和私聊</button>
      <button data-v="snaps">专属对话页</button>
      <button data-v="settings">设置</button>
    </div>
    <div class="bp-group" style="margin: 0 10px 14px" id="list"><div class="bp-empty">还没有聊天</div></div>
  </aside>
  <section class="main" id="main">
    <div class="main-h">
      <button class="bp-btn bp-btn-plain back" id="back">‹ 返回</button>
      <b id="title">选一个群或私聊</b>
      <button class="bp-btn" id="gearBtn" hidden>本群设置</button>
      <div class="bp-seg" id="viewTabs" role="tablist" hidden>
        <button data-v="log" class="on">问答</button>
        <button data-v="transcript">Claude 对话</button>
      </div>
      <button class="bp-btn" id="reset" hidden>重开对话</button>
    </div>
    <div class="gset" id="gset" hidden></div>
    <div class="msgs" id="msgs"><div class="bp-empty">左边选一个群或私聊：看收到和回复的消息、改本群设置。<br>机器人在的群都列在左边，没说过话的也在。</div></div>
    <div class="settings" id="settings" hidden></div>
    <div class="send" id="sendBar" hidden>
      <textarea class="bp-textarea" id="text" placeholder="以机器人的身份手动发一条（不经过 Claude）"></textarea>
      <button class="bp-btn bp-btn-primary" id="go">发送</button>
    </div>
  </section>
</div>
<script type="module">
  import { bridge } from '/plugins/_sdk/bridge-plugin.js';
  const $ = (id) => document.getElementById(id);
  let cur = null;          // 聊天 cid、'snap:<token>' 或 'settings'
  let side = 'chats';
  let view = 'log';
  let chats = [];
  let snaps = [];
  let last = null;         // 最近一次 chats 接口的结果
  let gearOpen = false;
  let formH = null;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const when = (t) => (t ? new Date(t).toLocaleString(undefined, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
  const usd = (x) => '$' + (Number(x) || 0).toFixed(2);
  const seg = (el, v) => { for (const b of el.querySelectorAll('button')) b.classList.toggle('on', b.dataset.v === v); };
  const err = (e) => bridge.toast(e.message || String(e), { error: true });

  // ── 动作按钮（插件详情里那些：检查连接、重启、扫码换号……）──
  const TOP = ['probe', 'relogin', 'restart-napcat'];
  let actions = [];
  async function loadActions() {
    try { actions = await bridge.actions(); } catch { actions = []; }
    const top = TOP.map((id) => actions.find((a) => a.id === id)).filter(Boolean);
    $('acts').innerHTML = top.map((a) => `<button class="bp-btn" data-act="${esc(a.id)}" title="${esc(a.desc)}">${esc(a.label)}</button>`).join('');
    for (const b of $('acts').querySelectorAll('[data-act]')) b.onclick = () => act(b.dataset.act, b);
  }
  async function act(id, btn) {
    if (btn) btn.disabled = true;
    try { const r = await bridge.action(id); if (r) bridge.toast(r.message || '好了'); }
    catch (e) { err(e); }
    finally { if (btn) btn.disabled = false; loadChats(); }
  }

  // ── 状态 + 列表 ──
  async function loadChats() {
    const r = await bridge.json('chats');
    last = r;
    chats = r.chats || [];
    $('pause').checked = !!r.paused;
    const st = r.waitingScan ? ['等待扫码登录', 'warn']
      : !r.online ? ['连不上 NapCat', 'warn']
      : (r.needScan || r.qqOnline === false) ? ['QQ 不在线，需要扫码', 'crit']
      : [`QQ 在线 · ${r.self.name || ''} ${r.self.id}${r.paused ? ' · 已暂停' : ''}`, r.paused ? 'warn' : 'ok'];
    $('state').textContent = st[0];
    $('state').className = 'bp-badge ' + st[1];
    const u = r.usage || {};
    $('usage').textContent = `今天 ${u.today?.turns || 0} 轮${r.dailyTurns ? ' / 上限 ' + r.dailyTurns : ''} · ${usd(u.today?.costUsd)}　累计 ${u.total?.turns || 0} 轮 · ${usd(u.total?.costUsd)}`;
    // 扫码：二维码直接放在这里
    if (r.waitingScan) {
      if (!$('qrImg')) $('qrBox').innerHTML = `<div class="qr"><b>用要当机器人的那个 QQ 号扫码</b><img id="qrImg" alt="登录二维码"><div class="hint">码大约 2 分钟换一张，这里会跟着刷新。在同一台手机上：长按图片保存，再用 QQ 扫一扫的「相册」选它。</div></div>`;
      if (r.qr) bridge.blobUrl('qrcode?t=' + Date.now()).then((u2) => { if ($('qrImg')) $('qrImg').src = u2; }).catch(() => {});
    } else $('qrBox').innerHTML = '';
    $('hint').innerHTML = r.waitingScan ? ''
      : r.online
      ? (r.needScan || r.qqOnline === false ? 'QQ 掉线了：点上面的「扫码登录 / 换号」。' : `NapCat 上报地址：<code>${esc(r.hookUrl)}</code>`)
      : `在 <code>${esc(r.apiUrl)}</code> 找不到 NapCat${r.lastErr ? '（' + esc(r.lastErr) + '）' : ''}。由 bridge 拉起的话点「重启 NapCat」；自己跑的话，NapCat「HTTP 客户端」上报地址填 <code>${esc(r.hookUrl)}</code>，消息格式选 Array。`;
    if (side === 'chats') renderChats();
    if (cur && cur !== 'settings' && !cur.startsWith('snap:') && gearOpen) renderGear();
  }
  function renderChats() {
    $('list').innerHTML = chats.length ? chats.map((c) => {
      const isG = c.cid.startsWith('g');
      const on = isG ? c.allowed && c.enabled : c.allowed;
      const tags = [isG ? (on ? '回答中' : c.allowed ? '本群关了' : '白名单外') : (on ? '私聊' : '私聊关了')];
      if (c.members) tags.push(c.members + ' 人');
      tags.push(c.count ? `${c.count} 条 · ${when(c.last)}` : '还没聊过');
      if (c.model) tags.push('模型 ' + c.model);
      if (c.effort) tags.push('思考 ' + c.effort);
      return `<div class="bp-row bp-click ${on ? '' : 'off'}" role="button" tabindex="0" data-cid="${esc(c.cid)}" ${cur === c.cid ? 'style="background:var(--bp-hover)"' : ''}>
        <div class="bp-row-main"><div class="bp-row-title"><span class="dot ${on ? 'on' : ''}"></span>${esc(c.name)}</div><div class="bp-row-desc">${esc(tags.join(' · '))}</div></div>
      </div>`;
    }).join('') : '<div class="bp-empty">QQ 登上以后，机器人在的群都会列在这里。</div>';
    bindRows((el) => open(el.dataset.cid));
  }
  async function loadSnaps() {
    const r = await bridge.json('snaps');
    snaps = r.snaps || [];
    $('list').innerHTML = snaps.length ? snaps.map((s) => `
      <div class="bp-row bp-click" role="button" tabindex="0" data-cid="snap:${esc(s.token)}" ${cur === 'snap:' + s.token ? 'style="background:var(--bp-hover)"' : ''}>
        <div class="bp-row-main"><div class="bp-row-title">${esc(s.note || s.token.slice(0, 8))}</div><div class="bp-row-desc">${when(s.createdAt)} · ${s.live ? '还开着' : '已关闭'}</div></div>
      </div>`).join('') : '<div class="bp-empty">还没人要过专属对话页。群友 @ 机器人发「/chat」就会有。</div>';
    bindRows((el) => open(el.dataset.cid));
  }
  function bindRows(fn) {
    for (const el of $('list').querySelectorAll('[data-cid]')) {
      el.onclick = () => fn(el);
      el.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(el); } };
    }
  }

  // ── 右边：聊天 / 专属对话页 / 设置 ──
  function show(mode) {
    $('msgs').hidden = mode === 'settings';
    $('settings').hidden = mode !== 'settings';
    $('viewTabs').hidden = mode !== 'chat';
    $('gearBtn').hidden = mode !== 'chat' || !cur?.startsWith('g');
    $('reset').hidden = mode !== 'chat';
    $('sendBar').hidden = mode !== 'chat';
    if (mode !== 'chat') { gearOpen = false; $('gset').hidden = true; }
  }
  async function open(cid) {
    cur = cid;
    $('wrap').classList.add('open');
    if (cid.startsWith('snap:')) {
      $('title').textContent = snaps.find((s) => 'snap:' + s.token === cid)?.note || '专属对话页';
      show('snap');
      await loadView();
      loadSnaps();
      return;
    }
    const c = chats.find((x) => x.cid === cid);
    $('title').textContent = c?.name || cid;
    show('chat');
    // 没聊过的群：直接把本群设置打开，方便开关
    gearOpen = cid.startsWith('g') && (!c || !c.count);
    $('gset').hidden = !gearOpen;
    if (gearOpen) renderGear();
    await loadView();
    renderChats();
  }
  function bubbles(list) {
    return list.map((m) => `
      <div class="m ${m.bot ? 'bot' : ''}"><div class="who">${esc(m.who)} · ${when(m.t)}</div><div class="tx">${esc(m.text)}</div>${m.tools ? `<div class="tools">用了：${esc(m.tools.join('、'))}</div>` : ''}</div>`).join('');
  }
  async function loadView() {
    if (!cur || cur === 'settings') return;
    const box = $('msgs');
    let list = [];
    try {
      if (cur.startsWith('snap:')) {
        const r = await bridge.json('snaplog?token=' + encodeURIComponent(cur.slice(5)));
        list = (r.messages || []).map((m) => ({ who: m.role === 'user' ? '访客' : 'Claude', bot: m.role !== 'user', text: m.text, t: m.ts }));
      } else if (view === 'transcript') {
        const r = await bridge.json('transcript?cid=' + encodeURIComponent(cur));
        list = (r.messages || []).map((m) => ({ who: m.role === 'user' ? '群友' : 'Claude', bot: m.role !== 'user', text: m.text, t: m.ts, tools: m.tools }));
      } else {
        const r = await bridge.json('log?cid=' + encodeURIComponent(cur));
        list = (r.messages || []).map((m) => ({ who: m.who + (m.qq ? ' (' + m.qq + ')' : '') + (m.cost ? ' · ' + usd(m.cost) : ''), bot: m.bot, text: m.text, t: m.t }));
      }
    } catch (e) { box.innerHTML = `<div class="bp-empty">${esc(e.message)}</div>`; return; }
    box.innerHTML = bubbles(list) || '<div class="bp-empty">这里还没有消息</div>';
    box.scrollTop = box.scrollHeight;
  }

  // ── 本群设置：回答开关、模型、思考强度、合并转发 ──
  let optModels = null, optEfforts = null;
  async function renderGear() {
    const gid = cur.slice(1);
    const c = chats.find((x) => x.cid === cur) || { allowed: true, enabled: true };
    if (!optModels) [optModels, optEfforts] = await Promise.all([bridge.options('groups.model').catch(() => []), bridge.options('groups.effort').catch(() => [])]);
    const sel = (id, list, v, first) => `<select class="bp-select" id="${id}"><option value="">${first}</option>${list.map((o) => `<option value="${esc(o.value)}" ${o.value === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    const fw = [['', '跟随全局'], ['long', '长回答才折'], ['always', '总是'], ['never', '从不']];
    const on = c.allowed && c.enabled;
    $('gset').innerHTML = `
      <div class="bp-section"><div class="bp-group">
        <div class="bp-row"><div class="bp-row-main"><div class="bp-row-title">本群回答</div>
          <div class="bp-row-desc">${c.allowed ? '关掉后机器人在这个群不说话（群聊照样记录）。' : '这个群不在白名单里，打开 = 加进白名单。'}</div></div>
          <label class="bp-switch"><input type="checkbox" id="gOn" ${on ? 'checked' : ''}><span></span></label></div>
        <div class="bp-row bp-row-stack"><div class="bp-row-main"><div class="bp-row-title">本群模型</div></div>${sel('gModel', optModels, c.model, '跟随全局')}</div>
        <div class="bp-row bp-row-stack"><div class="bp-row-main"><div class="bp-row-title">本群思考强度</div></div>${sel('gEffort', optEfforts, c.effort, '跟随全局')}</div>
        <div class="bp-row bp-row-stack"><div class="bp-row-main"><div class="bp-row-title">本群合并转发</div></div>
          <div class="bp-seg" id="gFw">${fw.map(([v, l]) => `<button type="button" data-v="${v}" class="${(c.forward || '') === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      </div></div>`;
    $('gOn').onchange = () => saveGroup(gid, { enabled: $('gOn').checked }, $('gOn').checked);
    $('gModel').onchange = () => saveGroup(gid, { model: $('gModel').value });
    $('gEffort').onchange = () => saveGroup(gid, { effort: $('gEffort').value });
    for (const b of $('gFw').querySelectorAll('button')) b.onclick = () => saveGroup(gid, { forward: b.dataset.v });
  }
  async function saveGroup(gid, patch, turnOn = false) {
    try {
      const { config } = await bridge.config.get();
      const groups = { ...(config.groups || {}) };
      groups[gid] = { ...(groups[gid] || {}), ...patch };
      const p = { groups };
      // 打开一个白名单外的群：加进白名单（白名单空 = 所有群都回答，不用加）
      const allow = config.allowGroups || [];
      if (turnOn && allow.length && !allow.includes(gid)) p.allowGroups = [...allow, gid];
      await bridge.config.set(p);
      bridge.toast('已保存');
    } catch (e) { err(e); }
    await loadChats();
  }

  // ── 设置页：插件的全部设置（按清单画）+ 其余工具按钮 ──
  function openSettings() {
    cur = 'settings';
    $('wrap').classList.add('open');
    $('title').textContent = '设置';
    show('settings');
    const box = $('settings');
    box.innerHTML = '<div id="formBox"></div><div class="bp-section"><div class="bp-section-title">工具</div><div class="bp-group" id="moreActs"></div></div>';
    formH?.destroy?.();
    formH = bridge.form($('formBox'), { exclude: ['groups'], onChange: () => loadChats() });
    $('moreActs').innerHTML = actions.map((a) => `<div class="bp-row"><div class="bp-row-main"><div class="bp-row-title">${esc(a.label)}</div>${a.desc ? `<div class="bp-row-desc">${esc(a.desc)}</div>` : ''}</div><button class="bp-btn" data-act="${esc(a.id)}">执行</button></div>`).join('') || '<div class="bp-empty">没有</div>';
    for (const b of $('moreActs').querySelectorAll('[data-act]')) b.onclick = () => act(b.dataset.act, b);
  }

  // ── 事件 ──
  $('viewTabs').onclick = (ev) => { const v = ev.target.closest('button')?.dataset.v; if (!v) return; view = v; seg($('viewTabs'), v); loadView(); };
  $('sideTabs').onclick = (ev) => {
    const v = ev.target.closest('button')?.dataset.v; if (!v) return;
    side = v; seg($('sideTabs'), v);
    if (v === 'chats') renderChats();
    else if (v === 'snaps') loadSnaps();
    else { $('list').innerHTML = '<div class="bp-empty">设置在右边（手机上在下一页）。改了立刻生效，不打断正在回答的问题。</div>'; openSettings(); }
  };
  $('gearBtn').onclick = () => { gearOpen = !gearOpen; $('gset').hidden = !gearOpen; if (gearOpen) renderGear(); };
  $('pause').onchange = async () => {
    const want = $('pause').checked;
    try { await bridge.config.set({ paused: want }); bridge.toast(want ? '已暂停回答' : '已恢复回答'); }
    catch (e) { err(e); }
    loadChats();
  };
  $('go').onclick = async () => {
    const text = $('text').value.trim();
    if (!text || !cur) return;
    $('go').disabled = true;
    try { await bridge.json('send', { cid: cur, text }); $('text').value = ''; bridge.toast('已发送'); loadView(); }
    catch (e) { err(e); }
    finally { $('go').disabled = false; }
  };
  $('reset').onclick = async () => {
    if (!cur || !(await bridge.confirm({ title: '重开这个聊天的对话？', desc: 'Claude 会忘掉之前在这里聊过的内容（沙箱里的文件和群聊记录保留），下一个问题开一段新对话。', yes: '重开' }))) return;
    await bridge.json('reset', { cid: cur });
    bridge.toast('已重开');
    loadChats();
  };
  $('back').onclick = () => { $('wrap').classList.remove('open'); if (cur === 'settings') { side = 'chats'; seg($('sideTabs'), 'chats'); renderChats(); } cur = null; };
  bridge.on('scan', () => loadChats());
  bridge.on('message', (p) => { loadChats(); if (p && p.cid === cur && view === 'log') loadView(); });
  bridge.onStatus(() => loadChats());
  setInterval(() => { if (last && (last.waitingScan || !last.online)) loadChats(); }, 15_000);   // 等扫码 / 连不上时勤刷
  await bridge.ready();
  loadActions();
  loadChats().catch((e) => { $('state').textContent = e.message; });
</script>
</body>
</html>
