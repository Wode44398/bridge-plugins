<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>便签</title>
<link rel="stylesheet" href="/plugins/_sdk/bridge-plugin.css">
<style>
  textarea { width: 100%; min-height: 50vh; box-sizing: border-box; padding: 12px 14px; font: inherit; font-size: 15px; line-height: 1.6;
             color: inherit; background: transparent; border: 0; outline: none; resize: vertical; }
  .status { font-size: 12.5px; color: var(--bp-muted); margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
<main class="bp-page">
  <h1 class="bp-h1" id="title">便签</h1>
  <p class="bp-muted" id="nocaps" hidden data-en="This bridge can't store page data yet. Update bridge and come back.">这台 bridge 还不支持页面存数据，升级后再来。</p>
  <div class="bp-section" id="box" hidden>
    <div class="bp-group">
      <textarea id="text" placeholder="写点什么……" data-en-ph="Write something…"></textarea>
    </div>
    <div class="status"><span id="count"></span> <span id="status"></span></div>
    <div class="bp-actions" style="margin-top:8px"><button class="bp-btn bp-btn-plain" id="clear" data-en="Clear">清空</button></div>
  </div>
</main>
<script type="module">
  import { bridge } from '/plugins/_sdk/bridge-plugin.js';
  const $ = (id) => document.getElementById(id);
  const info = await bridge.ready();
  const en = /^en/i.test(info.lang || '');
  const t = (zh, english) => (en ? english : zh);
  if (en) {
    document.documentElement.lang = 'en';
    document.title = $('title').textContent = 'Memo pad';
    for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset.en;
    for (const el of document.querySelectorAll('[data-en-ph]')) el.placeholder = el.dataset.enPh;
  }
  const can = typeof bridge.can === 'function' && bridge.can('kv');
  $('nocaps').hidden = can;
  if (can) {
    $('box').hidden = false;
    const area = $('text');
    area.value = String((await bridge.kv.get('memo').catch(() => '')) || '');
    let timer = 0;
    const paintCount = () => { $('count').textContent = t(`${area.value.length} 字`, `${area.value.length} chars`); };
    paintCount();
    $('clear').onclick = async () => {
      if (!area.value) return;
      if (!(await bridge.confirm({ title: t('清空这张便签？', 'Clear this memo?'), danger: true }))) return;
      area.value = ''; area.dispatchEvent(new Event('input'));
    };
    area.addEventListener('input', () => {
      paintCount();
      clearTimeout(timer);
      $('status').textContent = t('编辑中……', 'Editing…');
      timer = setTimeout(async () => {
        try { await bridge.kv.set('memo', area.value); $('status').textContent = t('已保存', 'Saved'); }
        catch (e) { $('status').textContent = ''; bridge.toast(e?.message || String(e), { error: true }); }
      }, 800);
    });
  }
</script>
</body>
</html>
